[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brainmem"
version = "0.1.0"
description = "Brain-inspired personal assistant memory engine (Markdown-first)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
brainmem = "brainmem.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
